<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Azamatjon Karimov — Full-Stack Developer · HealthTech">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="1" stop-color="#0b1a12"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="0.5" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#2ea8ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#39d353" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type1"><rect x="0" y="0" height="300" width="620">
      <animate attributeName="width" values="0;0;620;620" keyTimes="0;0.08;0.35;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .name{font-size:58px;font-weight:800;letter-spacing:-1px}
      .role{font-size:22px;fill:#8b949e}
      .prompt{font-size:18px;fill:#39d353}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .float{animation:float 4s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .px{animation:pulse 2.4s ease-in-out infinite}
      .px:nth-of-type(2n){animation-delay:.6s}
      .px:nth-of-type(3n){animation-delay:1.2s}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(320px)}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="1200" height="40" fill="#39d353" opacity="0.04"/>

  <!-- window bar -->
  <circle cx="36" cy="32" r="7" fill="#ff5f57"/>
  <circle cx="60" cy="32" r="7" fill="#febc2e"/>
  <circle cx="84" cy="32" r="7" fill="#28c840"/>
  <text x="112" y="38" class="mono" font-size="14" fill="#484f58">~/Karimov10112 — zsh</text>

  <!-- text block -->
  <text x="60" y="105" class="mono prompt">$ whoami</text>
  <text x="60" y="172" class="mono name" fill="url(#neon)" filter="url(#glow)">Azamatjon Karimov</text>
  <g clip-path="url(#type1)">
    <text x="60" y="215" class="mono role">&gt; Full-Stack Developer · HealthTech</text>
  </g>
  <text x="60" y="258" class="mono prompt">$ <tspan fill="#c9d1d9">building healthcare software for Uzbekistan</tspan><tspan class="cursor" fill="#39d353"> ▋</tspan></text>

  <!-- contribution-style pixel block -->
  <g class="float" transform="translate(860 70)">
    <rect x="-16" y="-16" width="300" height="190" rx="14" fill="#0d1117" stroke="#39d353" stroke-opacity="0.35"/>
    <g>
      <rect class="px" x="0"   y="0"   width="26" height="26" rx="5" fill="#0e4429"/>
      <rect class="px" x="34"  y="0"   width="26" height="26" rx="5" fill="#26a641"/>
      <rect class="px" x="68"  y="0"   width="26" height="26" rx="5" fill="#006d32"/>
      <rect class="px" x="102" y="0"   width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="136" y="0"   width="26" height="26" rx="5" fill="#0e4429"/>
      <rect class="px" x="170" y="0"   width="26" height="26" rx="5" fill="#26a641"/>
      <rect class="px" x="204" y="0"   width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="238" y="0"   width="26" height="26" rx="5" fill="#006d32"/>
      <rect class="px" x="0"   y="34"  width="26" height="26" rx="5" fill="#26a641"/>
      <rect class="px" x="34"  y="34"  width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="68"  y="34"  width="26" height="26" rx="5" fill="#0e4429"/>
      <rect class="px" x="102" y="34"  width="26" height="26" rx="5" fill="#006d32"/>
      <rect class="px" x="136" y="34"  width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="170" y="34"  width="26" height="26" rx="5" fill="#0e4429"/>
      <rect class="px" x="204" y="34"  width="26" height="26" rx="5" fill="#26a641"/>
      <rect class="px" x="238" y="34"  width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="0"   y="68"  width="26" height="26" rx="5" fill="#006d32"/>
      <rect class="px" x="34"  y="68"  width="26" height="26" rx="5" fill="#0e4429"/>
      <rect class="px" x="68"  y="68"  width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="102" y="68"  width="26" height="26" rx="5" fill="#26a641"/>
      <rect class="px" x="136" y="68"  width="26" height="26" rx="5" fill="#006d32"/>
      <rect class="px" x="170" y="68"  width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="204" y="68"  width="26" height="26" rx="5" fill="#0e4429"/>
      <rect class="px" x="238" y="68"  width="26" height="26" rx="5" fill="#26a641"/>
      <rect class="px" x="0"   y="102" width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="34"  y="102" width="26" height="26" rx="5" fill="#006d32"/>
      <rect class="px" x="68"  y="102" width="26" height="26" rx="5" fill="#26a641"/>
      <rect class="px" x="102" y="102" width="26" height="26" rx="5" fill="#0e4429"/>
      <rect class="px" x="136" y="102" width="26" height="26" rx="5" fill="#39d353"/>
      <rect class="px" x="170" y="102" width="26" height="26" rx="5" fill="#26a641"/>
      <rect class="px" x="204" y="102" width="26" height="26" rx="5" fill="#006d32"/>
      <rect class="px" x="238" y="102" width="26" height="26" rx="5" fill="#39d353"/>
    </g>
    <text x="0" y="160" class="mono" font-size="13" fill="#8b949e">commit · build · ship · repeat</text>
  </g>
</svg>
